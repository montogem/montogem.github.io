<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxuryWear | Премиальная одежда</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Навигация -->
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">LuxuryWear</a>
            <nav class="nav-menu">
                <a href="catalog.html">Каталог</a>
                <a href="#about">О нас</a>
            </nav>
            <div class="user-actions">
                <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
                <a href="login.html" class="login-btn">Войти</a>
            </div>
        </div>
    </header>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="hero-text">
            <h1>Новая коллекция 2026</h1>
            <p>Идеальный стиль для любого случая.</p>
            <a href="catalog.html" class="btn">Смотреть каталог</a>
        </div>
    </section>

    <!-- Популярные товары -->
    <section class="featured-products container">
        <h2>Популярные модели</h2>
        <!-- Контейнер, куда JavaScript добавит карточки товаров -->
        <div class="products-grid" id="products-grid"></div>
    </section>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 LuxuryWear. Все права защищены.</p>
        </div>
    </footer>

    <!-- Подключение логики -->
    <script src="js/app.js"></script>
</body>
</html>
